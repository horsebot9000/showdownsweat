name: Refresh model
on:
  schedule:
    - cron: '0 11 * * 2'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data
          key: nfl-data-${{ github.run_id }}
          restore-keys: nfl-data-
      - name: Refresh and build
        run: python refresh.py --ci
      - name: Show the log if it failed
        if: failure()
        run: tail -n 80 refresh.log || true
      - name: Publish the new page
        run: |
          cp output/showdown-sweat.html index.html
          git config user.name "sweat-refresh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Weekly model refresh $(date -u +%Y-%m-%d)"
          git push
