# Weekly model refresh for Showdown Sweat.
# Tuesday 11:00 UTC (7 AM Eastern), after Monday Night Football is in nflverse's play-by-play.
# Downloads the season's data, refits the model, rebuilds the page, and commits index.html.
# Also runs whenever code in pipeline/ changes. By hand: Actions tab > Refresh model > Run workflow.
name: Refresh model
on:
  schedule:
    - cron: '0 11 * * 2'   # Tuesday 7 AM Eastern, after Monday Night Football
    - cron: '0 11 * * 3'   # Wednesday backup in case nflverse posts late (no change, no commit)
  push:                    # any code change rebuilds the page right away
    branches: [main]
    paths: ['pipeline/**', 'refresh.py', 'requirements.txt', '.github/workflows/refresh.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      # past seasons' play-by-play never changes: keep it between runs so only the current season downloads
      - uses: actions/cache@v4
        with:
          path: data
          key: nfl-data-${{ github.run_id }}
          restore-keys: nfl-data-
      - name: Refresh and build
        run: python refresh.py --ci
      - name: Show the log if it failed
        if: failure()
        run: tail -n 80 refresh.log || true
      - name: Publish the new page
        run: |
          cp output/showdown-sweat.html index.html
          git config user.name "sweat-refresh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Weekly model refresh $(date -u +%Y-%m-%d)"
          git push
